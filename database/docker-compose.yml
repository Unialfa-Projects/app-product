services:
  postgres:
    image: postgres:16-alpine
    container_name: sige-produtos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sige}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sige}
      POSTGRES_DB: ${POSTGRES_DB:-sige_produtos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sige_produtos_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sige} -d ${POSTGRES_DB:-sige_produtos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sige_produtos_dados:

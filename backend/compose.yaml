services:
  banco:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: produtos
      POSTGRES_USER: produtos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-produtos_dev}
    volumes:
      - dados_postgres_uml:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtos -d produtos"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

  backend:
    build: .
    environment:
      PORT: 3000
      PGHOST: banco
      PGPORT: 5432
      PGDATABASE: produtos
      PGUSER: produtos
      PGPASSWORD: ${POSTGRES_PASSWORD:-produtos_dev}
      GESTOR_API_KEY: ${GESTOR_API_KEY:-gestor_dev_trocar}
      OPERADOR_API_KEY: ${OPERADOR_API_KEY:-operador_dev_trocar}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3000"

volumes:
  dados_postgres_uml:
